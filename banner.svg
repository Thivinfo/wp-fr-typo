<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 1544 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1521;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2744;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0073aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a0d2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1544" height="500" fill="url(#bg)"/>

  <!-- Grille de fond subtile -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1544" y2="100"/>
    <line x1="0" y1="200" x2="1544" y2="200"/>
    <line x1="0" y1="300" x2="1544" y2="300"/>
    <line x1="0" y1="400" x2="1544" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
    <line x1="1000" y1="0" x2="1000" y2="500"/>
    <line x1="1200" y1="0" x2="1200" y2="500"/>
    <line x1="1400" y1="0" x2="1400" y2="500"/>
  </g>

  <!-- Cercle décoratif gauche -->
  <circle cx="120" cy="250" r="220" fill="none" stroke="#0073aa" stroke-width="1" opacity="0.15"/>
  <circle cx="120" cy="250" r="160" fill="none" stroke="#0073aa" stroke-width="1" opacity="0.1"/>

  <!-- Cercle décoratif droit -->
  <circle cx="1424" cy="250" r="220" fill="none" stroke="#00a0d2" stroke-width="1" opacity="0.15"/>
  <circle cx="1424" cy="250" r="160" fill="none" stroke="#00a0d2" stroke-width="1" opacity="0.1"/>

  <!-- Ligne accent gauche -->
  <rect x="0" y="0" width="6" height="500" fill="url(#accent)"/>

  <!-- Barre accent horizontale -->
  <rect x="6" y="246" width="1538" height="4" fill="url(#accent)" opacity="0.12"/>

  <!-- Bloc central -->
  <!-- Guillemets décoratifs -->
  <text x="200" y="310" font-family="Georgia, serif" font-size="200" fill="#0073aa" opacity="0.08">«</text>
  <text x="1110" y="310" font-family="Georgia, serif" font-size="200" fill="#0073aa" opacity="0.08">»</text>

  <!-- Tag skill -->
  <rect x="560" y="128" width="180" height="32" rx="16" fill="#0073aa" opacity="0.25"/>
  <text x="650" y="150" font-family="'Courier New', monospace" font-size="13" fill="#00a0d2" text-anchor="middle" letter-spacing="3">CLAUDE SKILL</text>

  <!-- Titre principal -->
  <text x="772" y="240" font-family="'Arial', sans-serif" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-1" filter="url(#glow)">wp-fr-typo</text>

  <!-- Sous-titre -->
  <text x="772" y="298" font-family="'Arial', sans-serif" font-size="24" font-weight="400" fill="#8ab4d4" text-anchor="middle" letter-spacing="1">Traduction WordPress FR · Glossaire officiel · Règles Polyglots</text>

  <!-- Ligne séparatrice -->
  <rect x="572" y="322" width="400" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>

  <!-- Badges texte -->
  <text x="772" y="365" font-family="'Arial', sans-serif" font-size="15" fill="#5a8fa8" text-anchor="middle">602 termes officiels · Fichiers .po · GlotPress · Auto-apprentissage</text>

  <!-- WordPress logo stylisé (W) -->
  <text x="1380" y="420" font-family="'Arial', sans-serif" font-size="80" font-weight="900" fill="#0073aa" opacity="0.12">WP</text>

  <!-- Signature -->
  <text x="1524" y="486" font-family="'Arial', sans-serif" font-size="12" fill="#2d4a6a" text-anchor="end">thierrypigot</text>
</svg>
